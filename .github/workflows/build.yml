name: Build PS4 Volume Control Plugin

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld clang curl tar make

      - name: Download OpenOrbis Toolchain
        run: |
          curl -sL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar xz -C ./
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
          chmod +x $GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/bin/linux/* || true

      - name: Clone and Setup GoldHEN Plugins SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git /tmp/GoldHEN_SDK
          cd /tmp/GoldHEN_SDK
          make
          make install || true
          echo "GOLDHEN_SDK=/tmp/GoldHEN_SDK" >> $GITHUB_ENV

      - name: Build ps4_volume_control.prx
        run: |
          make all 2>&1 | tee build.log
          echo "::error::LOG: $(cat build.log | tr '\n' ' ')"
          echo "::error::FILES: $(find . -maxdepth 2 | tr '\n' ' ')"

      - name: Upload compiled PRX
        uses: actions/upload-artifact@v4
        with:
          name: ps4_volume_control
          path: |
            ps4_volume_control.prx
            **/*.prx
          if-no-files-found: error
